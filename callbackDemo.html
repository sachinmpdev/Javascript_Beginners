<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Csllback Function</title>
</head> 
<body>
        <script>
            function fun1(){
                console.log("I am function 1 will execute first");                
            }
            
            function fun2(){
                console.log("I am function 2 will execute last after 2milisecond")                
            }
            fun1();
            fun2();

            function first(){
               
                setTimeout(function(){
                    console.log("Inside function: first");
                },5500);
            }
            
            function second(){
                console.log("Inside function: Second");
            }
            first();
            second();
        </script>
</body>
</html>
