<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>callback function example 2</title>
</head>
<body>
    <h1>Demonstrating callback function in javascript</h1>   
    <script>
        function multiply(a,b, callback){
            var result = a*b;
            callback(result);
        }

        function output(sum){
            console.log("I am inside of output function");
            console.log("Multiplication of the provided inputs are:" +sum);
        }

        function display(sum){
            console.log("I am inside display function");
            console.log("Multiplication of the provided input are:" +sum);
        }

        multiply(5,6,output);
        multiply(7,6,display);
    </script>
</body>
</html>
