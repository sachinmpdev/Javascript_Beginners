<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Demonstrating callback function in javascript</h1>
    <script>
        function greet(name, callback){
            const greeting = `Hello, ${name}!`;
            callback(greeting);
        }

        function logMsg(message){
            console.log(message);
        }

        greet("world",logMsg);
    </script>
</body>
</html>
